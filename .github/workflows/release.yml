name: release

# Releases are cut by pushing a tag, so the binaries people download are built
# from a known commit by the same checks that gate every other build, rather
# than uploaded by hand from somebody's laptop.
on:
  push:
    tags: ['v*']
  # Cutting a release from the Actions UI, for when pushing a tag is not
  # convenient. Supplying a version here publishes exactly as a tag push would;
  # the Releases API creates the tag against the chosen commit. Leaving it empty
  # exercises the packaging without publishing anything.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. v0.1.0. Leave empty to build only.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  # The same tests that run on every push, run again against the exact commit
  # being released. A release is the worst possible place to discover that the
  # estimator regressed.
  test:
    name: test (linux, software GL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install OpenGL development packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libglew-dev libgl1-mesa-dev libegl1-mesa-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  windows:
    name: package (windows x64)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: cmake -S . -B build -A x64 -DDATAMOSH_BUILD_TESTS=OFF

      - name: Build
        run: cmake --build build --config Release --parallel

      # plugMain is the only symbol a host looks up, and it lives in a
      # translation unit nothing else references. Shipping a binary that lost it
      # would produce a plugin that loads nowhere and says nothing about why.
      - name: Verify the plugin entry point is exported
        shell: pwsh
        timeout-minutes: 5
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath  = & $vswhere -latest -products * -property installationPath
          $dumpbin = Get-ChildItem "$vsPath\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" |
                     Select-Object -First 1 -ExpandProperty FullName
          if (-not $dumpbin) { throw "could not locate dumpbin.exe" }

          Get-ChildItem build/src/plugins/Release/*.dll | ForEach-Object {
            Write-Host "== $($_.Name)"
            $exports = & $dumpbin /exports $_.FullName
            if (-not ($exports -match 'plugMain')) { throw "plugMain not exported from $($_.Name)" }
          }

      # Both the FFGL SDK and GLEW are BSD-style and require their copyright
      # notice to accompany binary redistribution. Generating the file from the
      # licences actually in the tree keeps it honest if either dependency moves.
      - name: Stage the archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path staging | Out-Null
          Copy-Item build/src/plugins/Release/*.dll staging/
          Copy-Item packaging/INSTALL-windows.txt staging/INSTALL.txt
          if (Test-Path LICENSE) { Copy-Item LICENSE staging/ }

          $notice  = "These plugins link the following third-party components.`n`n"
          $notice += "=" * 72 + "`nFreeFrame / FFGL SDK`n" + "=" * 72 + "`n`n"
          $notice += Get-Content external/ffgl/LICENSE.md -Raw
          $notice += "`n`n" + "=" * 72 + "`nGLEW - The OpenGL Extension Wrangler Library`n" + "=" * 72 + "`n`n"
          $notice += Get-Content external/ffgl/deps/glew-2.1.0/LICENSE.txt -Raw
          Set-Content -Path staging/THIRD-PARTY.txt -Value $notice

          Compress-Archive -Path staging/* -DestinationPath datamosh-windows-x64.zip

      - name: Verify the archive layout
        shell: pwsh
        run: |
          $entries = (Get-ChildItem staging).Name
          foreach ($expected in @('Datamosh.dll','DatamoshTransplant.dll','INSTALL.txt','THIRD-PARTY.txt')) {
            if ($entries -notcontains $expected) { throw "$expected missing from the archive" }
          }
          Write-Host "layout ok: $($entries -join ', ')"

      - uses: actions/upload-artifact@v4
        with:
          name: datamosh-windows-x64
          path: datamosh-windows-x64.zip
          if-no-files-found: error

  macos:
    name: package (macos universal)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DDATAMOSH_BUILD_TESTS=OFF

      - name: Build
        run: cmake --build build --parallel

      # Resolume 7.11+ runs natively on Apple Silicon and will not load an
      # x86_64-only plugin, so a single-architecture bundle is a broken release
      # for half the audience.
      - name: Verify architectures and entry point
        run: |
          for bundle in build/src/plugins/*.bundle; do
            binary="$bundle/Contents/MacOS/$(basename "$bundle" .bundle)"
            echo "== $binary"
            lipo -archs "$binary"
            lipo -archs "$binary" | grep -q arm64
            lipo -archs "$binary" | grep -q x86_64
            nm -gU "$binary" | grep -qw _plugMain
          done

      - name: Stage the archive
        run: |
          mkdir -p staging
          cp -R build/src/plugins/*.bundle staging/
          cp packaging/INSTALL-macos.txt staging/INSTALL.txt
          cp LICENSE staging/ 2>/dev/null || true

          # The FFGL SDK is BSD-style and requires its copyright notice to
          # accompany binary redistribution. GLEW is not listed here because
          # macOS links the system OpenGL directly and never pulls it in.
          {
            echo "These plugins link the following third-party components."
            echo
            printf '=%.0s' {1..72}; echo
            echo "FreeFrame / FFGL SDK"
            printf '=%.0s' {1..72}; echo
            echo
            cat external/ffgl/LICENSE.md
          } > staging/THIRD-PARTY.txt
          # ditto rather than zip: it preserves the bundle structure and the
          # resource forks a .bundle depends on. No --keepParent, or the build's
          # own staging directory name ends up as a folder inside the download.
          ( cd staging && ditto -c -k --sequesterRsrc . ../datamosh-macos-universal.zip )

      # Checking what actually ships, rather than what went into it. The first
      # release had every file nested under the staging directory, which the
      # build steps all passed happily.
      - name: Verify the archive layout
        run: |
          unzip -l datamosh-macos-universal.zip
          contents=$(unzip -Z1 datamosh-macos-universal.zip)
          for expected in Datamosh.bundle/ DatamoshTransplant.bundle/ INSTALL.txt THIRD-PARTY.txt; do
            echo "$contents" | grep -qE "^${expected}" || {
              echo "::error::$expected is not at the root of the archive"; exit 1; }
          done
          # A path segment before the bundle means something wrapped it.
          echo "$contents" | grep -qE "^[^/]+/.*\.bundle/" && {
            echo "::error::archive contents are nested inside a folder"; exit 1; }
          echo "layout ok"

      # The installer, and the reason it exists: a .zip propagates
      # com.apple.quarantine to everything it extracts, and Apple's rule is that
      # a host may load a quarantined plug-in only if it is notarised. Resolume
      # does not surface the "allow anyway" prompt, so the plugin simply never
      # appears — which is why the zip has to ship with an xattr command. An
      # installer payload is laid down by installd, which is not quarantine
      # aware, so the same binaries delivered this way just work.
      #
      # Runs without secrets too. Unsigned, the user clears one Gatekeeper
      # dialog and the plugins load afterwards; forks and pull requests need
      # that path to work.
      - name: Build the installer package
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          # VERSION is resolved in the publish job, which has not run yet, so
          # this derives its own — only for the package's internal metadata,
          # which macOS uses to compare installs. The published filename is
          # applied by publish, exactly as it is for the zips. A branch build
          # has no version in its ref at all, hence the fallback.
          version="${{ inputs.version }}"
          if [ -z "$version" ]; then version="${GITHUB_REF_NAME}"; fi
          version="${version#v}"
          case "$version" in
            [0-9]*) ;;
            *)      version="0.0.0" ;;
          esac
          echo "packaging version ${version}"

          mkdir -p pkg-payload
          cp -R build/src/plugins/*.bundle pkg-payload/
          bash packaging/macos/build-pkg.sh pkg-payload "$version" datamosh-macos.pkg

      # Signing is optional; a package that would install the quarantine flag it
      # exists to avoid is not. Expanding the built package and inspecting the
      # payload is the only way to see what a user will actually receive.
      - name: Verify the package payload
        run: |
          pkg="datamosh-macos.pkg"
          test -f "$pkg" || { echo "::error::no package produced"; exit 1; }

          pkgutil --expand "$pkg" expanded
          found=0
          for component in expanded/*.pkg; do
            [ -d "$component" ] || continue
            found=1
            ( cd "$component" && tar xzf Payload 2>/dev/null || true )
            echo "== $component"
            ls "$component"
          done
          [ "$found" = "1" ] || { echo "::error::package contains no components"; exit 1; }

          # Both plugins must be in there, or the installer is an elaborate no-op.
          for expected in Datamosh.bundle DatamoshTransplant.bundle; do
            find expanded -name "$expected" -maxdepth 4 | grep -q . || {
              echo "::error::$expected missing from the package payload"; exit 1; }
          done

          # The whole point. Anything quarantined in the payload is restored on
          # install, and the user is back to the terminal command with no clue why.
          if xattr -lr expanded | grep -q 'com.apple.quarantine'; then
            echo "::error::package payload carries com.apple.quarantine"
            exit 1
          fi
          echo "payload ok, no quarantine"

      - uses: actions/upload-artifact@v4
        with:
          name: datamosh-macos-universal
          path: datamosh-macos-universal.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: datamosh-macos-pkg
          path: datamosh-macos.pkg
          if-no-files-found: error

  publish:
    name: publish release
    needs: [test, windows, macos]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Resolve the version
        run: |
          version="${{ inputs.version }}"
          if [ -z "$version" ]; then version="${GITHUB_REF_NAME}"; fi

          # Normalise to a leading v. A tag push always has one, because the
          # trigger filter is 'v*', but the dispatch input is free text and
          # entering "0.1.3" produced a release tagged 0.1.3 with archives
          # called datamosh-0.1.3-*, sitting alongside three v-prefixed ones.
          # Nothing broke — it just made the newest release, the one people
          # download, the odd one out. The workflow should not depend on
          # whoever fills the box remembering.
          case "$version" in
            v*) ;;
            *)  version="v${version}" ;;
          esac

          # A version that is not vMAJOR.MINOR.PATCH is far more likely to be a
          # typo in the dispatch box than an intentional tag, and a published
          # release is awkward to retract.
          if ! printf '%s' "$version" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'; then
            echo "::error::version '${version}' is not vMAJOR.MINOR.PATCH"
            exit 1
          fi

          echo "VERSION=${version}" >> "$GITHUB_ENV"
          echo "releasing ${version}"

      - name: Name the archives after the version
        run: |
          mkdir -p release
          mv artifacts/datamosh-windows-x64.zip      "release/datamosh-${VERSION}-windows-x64.zip"
          mv artifacts/datamosh-macos-universal.zip  "release/datamosh-${VERSION}-macos-universal.zip"
          mv artifacts/datamosh-macos.pkg           "release/datamosh-${VERSION}-macos.pkg"
          ls -la release

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          # Explicit rather than inferred from the ref, so a dispatched release
          # works too. The Releases API creates the tag if it does not exist.
          tag_name: ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          files: release/*
          # Marked as a pre-release until the plugin has been run inside
          # Resolume. Everything is verified against synthetic footage in a
          # headless context; none of it is verified against the actual host.
          prerelease: true
          generate_release_notes: false
          body_path: packaging/RELEASE-NOTES.md
